name: Salawaty
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QQJLRWJ2ST
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: en
targets:
  Salawaty:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources/Adhan
        type: folder
        buildPhase: resources
    dependencies:
      - target: SalawatyWidgets   # embedded in Salawaty.app/Contents/PlugIns
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Salawaty
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSLocationUsageDescription: Salawaty uses your location to calculate accurate prayer times.
        NSLocationWhenInUseUsageDescription: Salawaty uses your location to calculate accurate prayer times.
        AppGroupIdentifier: "$(TeamIdentifierPrefix)com.yourname.Salawaty"
        CFBundleLocalizations: [en, ar, tr, ur, fr, id]
        CFBundleDevelopmentRegion: en
        CFBundleURLTypes:
          - CFBundleURLName: com.yourname.Salawaty
            CFBundleURLSchemes: [salawaty]
    entitlements:
      path: Sources/Salawaty.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.location: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)com.yourname.Salawaty"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.Salawaty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SalawatyWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"   # desktop widgets need macOS 14 (Sonoma)
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Salawaty Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: "$(TeamIdentifierPrefix)com.yourname.Salawaty"
        ATSApplicationFontsPath: "."   # loads the bundled Amiri Quran font
    entitlements:
      path: Widgets/SalawatyWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(TeamIdentifierPrefix)com.yourname.Salawaty"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.Salawaty.Widgets

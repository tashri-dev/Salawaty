name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release (unsigned)
        run: |
          rm -rf build
          xcodebuild -project Salawaty.xcodeproj -scheme Salawaty -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            -derivedDataPath build clean build

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "build/Build/Products/Release/Salawaty.app"

      - name: Package DMG
        run: |
          STAGE=$(mktemp -d)
          cp -R "build/Build/Products/Release/Salawaty.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Salawaty" -srcfolder "$STAGE" -ov -format UDZO "Salawaty-${{ steps.version.outputs.version }}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Salawaty-${{ steps.version.outputs.version }}.dmg" \
            --title "Salawaty ${{ github.ref_name }}" \
            --generate-notes
